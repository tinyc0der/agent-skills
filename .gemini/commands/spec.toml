description = "Start spec-driven development — write a structured specification before writing code"

prompt = """
Invoke the spec-driven-development skill.

Begin by understanding what the user wants to build. Ask clarifying questions about:
1. The objective and target users
2. Core features and acceptance criteria
3. Tech stack preferences and constraints
4. Known boundaries (what to always do, ask first about, and never do)

Then generate a structured spec covering objective, non-goals, project context, affected structure, testing and verification, boundaries, success criteria, and open questions. Reference existing project-wide commands and conventions instead of copying them unless the feature changes them.

If the request bundles several independently testable capabilities, first propose a capability map (module ids, dependency direction, build order) per the skill's Phase 0 and get it approved, then spec each module in dependency order.

Require a non-default feature branch and derive a filesystem-safe <feature-slug> from it using the skill's branch mapping. Save a single-capability spec as docs/specs/<feature-slug>/spec.md. For a multi-capability initiative, save the approved map as docs/specs/<feature-slug>/capability-map.md and each module spec as docs/specs/<feature-slug>/spec-<module-id>.md. Confirm approval, then stop and hand off to /planning; do not create tasks or implementation code.
"""
