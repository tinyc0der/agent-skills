description = "Automatically discover the next release, then run revision-aware checks and a rollback-backed go/no-go gate"

prompt = """
Invoke the shipping-and-launch skill.

**Workflow notes:** For an active track, read `docs/tracks/<track-id>/notes.md` at phase entry or resume and update it when useful context changes or before handoff. Capture observations, tentative ideas, outcomes, blockers, and next actions with evidence links. Follow the memory-management running-note protocol; honor explicit read-only or file-scope limits and keep writes outside pinned verification or release targets.

`/ship` is the production-release gate. Its normal interface is zero-argument.

## Phase 0 — Discover and confirm the release

The shipping-and-launch skill owns the complete **Automatic Release Discovery** workflow. Follow that section exactly: discover and pin the release without required identifiers, present its release preview, and require human confirmation before continuing. Keep only harness-specific persona orchestration in this command.

## Phase A — Reuse evidence and refresh stale checks

For every included PR with a change track, load its docs/tracks/<track-id>/ship.md launch dossier, revision-scoped docs/tracks/<track-id>/verification.md and docs/tracks/<track-id>/review.md evidence, and docs/tracks/<track-id>/notes.md when present. Determine which specialist reports are stale, missing, or invalidated by release changes. When more than one is needed, spawn them concurrently. Gemini CLI exposes each custom subagent in `agents/` as a tool with the same name.

Dispatch each persona by tool name:

1. **`code-reviewer`** — Run a five-axis review (correctness, readability, architecture, security, performance) on the staged changes or recent commits. Output the standard review template.
2. **`security-auditor`** — Run a vulnerability and threat-model pass. Check OWASP Top 10, secrets handling, auth/authz, dependency CVEs. Output the standard audit report.
3. **`test-engineer`** — Analyze whether materially changed contracts and credible release risks have distinct coverage at the cheapest reliable layer. Report required gaps plus merge, rewrite, or remove candidates; do not enumerate a generic scenario matrix or duplicate the same assertion across layers. Output the standard coverage analysis.

If subagents are unavailable in the current Gemini CLI version, invoke each required persona's system prompt sequentially in the main context; do not describe sequential execution as parallel.

Constraints (from Gemini CLI's subagent model):
- Subagents run in isolated context loops and return only their report to this main session.
- Do not let one persona delegate to another — keep the fan-out flat.
- For richer multi-agent collaboration where teammates talk to each other instead of just reporting back, see `references/orchestration-patterns.md`.

**Persona resolution.** If you've defined your own `code-reviewer`, `security-auditor`, or `test-engineer` in `agents/` (this plugin's agents, at the repo root) or `~/.gemini/agents/` (user-level), those take precedence over this plugin's versions — `/ship` picks up your customizations automatically. This is intentional: plugin subagents sit at the bottom of Gemini CLI's scope priority table, so user-level definitions win by design.

## Phase B — Merge in main context

Once all required reports are collected—reused when current, refreshed when stale—the main agent (not a sub-persona) synthesizes them:

1. **Code Quality** — Aggregate Critical/Required findings from revision-matched `code-reviewer` and verification evidence. Resolve duplicates between reviewers.
2. **Security** — Promote any Critical/High `security-auditor` findings to launch blockers. Cross-reference with `code-reviewer`'s security axis.
3. **Performance** — Pull from `code-reviewer`'s performance axis; cross-check Core Web Vitals if applicable.
4. **Accessibility** — Verify keyboard nav, screen reader support, contrast (not covered by the three personas — handle directly here, or invoke the accessibility checklist).
5. **Infrastructure** — Env vars, migrations, monitoring, feature flags. Verify directly.
6. **Documentation** — README, ADRs, changelog. Verify directly.

## Phase C — Decision and rollback

Produce a single output:

```markdown
## Ship Decision: GO | NO-GO

### Blockers (must fix before ship)
- [Source persona: Critical finding + file:line]

### Required fixes (must fix before ship)
- [Source persona: Required finding + file:line]

### Optional recommendations
- [Source persona: Optional finding + file:line]

### Acknowledged risks (shipping anyway)
- [Risk + mitigation]

### Rollback plan
- Trigger conditions: [what signals would prompt rollback]
- Rollback procedure: [exact steps]
- Recovery time objective: [target]

### Specialist evidence
- [code-reviewer report: reused/refreshed/not applicable + revision]
- [security-auditor report: reused/refreshed/not applicable + revision]
- [test-engineer report: reused/refreshed/not applicable + revision]
```

## Rules

1. Reuse a release-scoped specialist report only when it names the exact release revision and no relevant environment, configuration, migration, or dependency change invalidates it. Reuse PR-scoped review evidence only when its reviewed patch maps unchanged into the release.
2. Run every stale or missing specialist report; when several are required and parallel execution is available, run them concurrently.
3. Personas do not call each other. The main agent merges in Phase B.
4. The rollback plan is mandatory before any GO decision.
5. Any unresolved Critical or Required finding makes the verdict NO-GO.
6. Persist the authoritative release-wide decision in the configured release or deployment system; do not commit it before deployment because that would mutate the pinned target. A later documentation-only change may append the immutable deployment identifier to each included docs/tracks/<track-id>/ship.md.
"""
